<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nueva Venta - CellStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neon-border { border: 1px solid rgba(14, 165, 233, 0.3); }
        .neon-glow { box-shadow: 0 0 15px rgba(14, 165, 233, 0.15); }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

    <div class="w-full bg-slate-900 min-h-screen flex flex-col justify-between">

        <!-- Cabecera -->
        <header class="bg-slate-900/90 backdrop-blur-md p-4 border-b border-slate-800 flex items-center justify-between sticky top-0 z-50">
            <a href="index.html" class="text-cyan-400 font-bold text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl border border-cyan-500/30">⬅ Volver</a>
            <h1 class="text-base font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">REGISTRAR VENTA</h1>
            <span class="text-[11px] text-slate-500 px-3 py-2 font-mono">🖨️ RawBT</span>
        </header>

        <!-- Formulario de Venta -->
        <main class="p-4 flex-grow space-y-4">
            <div class="bg-slate-900/80 p-4 rounded-2xl neon-border neon-glow">
                <h2 class="font-bold text-cyan-400 text-xs uppercase tracking-wider mb-3 flex items-center gap-2">
                    <span>⚡</span> Seleccionar Tipo de Venta
                </h2>

                <div class="flex gap-1.5 mb-4">
                    <button type="button" onclick="cambiarTipoVenta('celular')" id="btnTabCel" class="flex-1 py-2 text-[11px] font-bold rounded-xl bg-cyan-500 text-slate-950 transition">Celular</button>
                    <button type="button" onclick="cambiarTipoVenta('accesorio')" id="btnTabAcc" class="flex-1 py-2 text-[11px] font-bold rounded-xl bg-slate-800 text-slate-300 transition">Accesorio</button>
                    <button type="button" onclick="cambiarTipoVenta('hidrogel')" id="btnTabHid" class="flex-1 py-2 text-[11px] font-bold rounded-xl bg-slate-800 text-slate-300 transition">Hidrogel</button>
                    <button type="button" onclick="cambiarTipoVenta('skin')" id="btnTabSkin" class="flex-1 py-2 text-[11px] font-bold rounded-xl bg-slate-800 text-slate-300 transition">Skin</button>
                </div>

                <form id="formVenta" class="space-y-3">
                    <div id="seccionCampos">
                        <!-- Contenedor dinámico -->
                    </div>

                    <!-- Nombre del Comprador -->
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Nombre del Comprador / Cliente</label>
                        <input type="text" id="nombreComprador" placeholder="Ej. Juan Pérez" required class="w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:border-cyan-500 focus:outline-none text-slate-100">
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 active:scale-95 text-slate-950 font-black p-3 rounded-xl shadow-lg shadow-cyan-500/20 transition-all text-xs tracking-wider uppercase mt-2">
                        Completar Venta e Imprimir
                    </button>
                </form>
            </div>

            <!-- Devolución de ventas anteriores -->
            <div class="bg-slate-900/80 rounded-2xl border border-amber-500/30">
                <button type="button" onclick="devAlternar()" class="w-full flex justify-between items-center p-3 text-left">
                    <span class="font-bold text-amber-400 text-xs uppercase tracking-wider">↩️ Registrar devolución</span>
                    <span id="devFlecha" class="text-amber-400 text-xs">▼</span>
                </button>
                <div id="panelDevolucion" class="hidden p-3 pt-0 space-y-3">
                    <p class="text-[10px] text-slate-400">Para productos vendidos en días anteriores. Se resta del corte de hoy. Si la venta es de hoy, usa mejor el botón <strong class="text-rose-400">Anular</strong> de la lista.</p>

                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Categoría</label>
                        <select id="devCategoria" onchange="devCambiarCategoria()" class="w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:border-amber-500 focus:outline-none text-slate-100">
                            <option value="celular">Celular</option>
                            <option value="accesorio">Accesorio</option>
                            <option value="hidrogel">Hidrogel</option>
                            <option value="skin">Skin</option>
                        </select>
                    </div>

                    <div id="devCampos"></div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Monto devuelto (Bs)</label>
                            <input type="number" id="devMonto" step="0.01" min="0" placeholder="0.00" class="w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:border-amber-500 focus:outline-none text-slate-100 font-bold text-amber-400">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Cliente (opcional)</label>
                            <input type="text" id="devCliente" placeholder="Nombre" class="w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:border-amber-500 focus:outline-none text-slate-100">
                        </div>
                    </div>

                    <label class="flex items-start gap-2 text-[11px] text-slate-300">
                        <input type="checkbox" id="devRestock" checked class="mt-0.5 accent-amber-500">
                        <span>El producto está en buen estado y <strong>vuelve al stock</strong>. Desmárcalo si viene dañado: no vuelve al inventario y el costo cuenta como pérdida.</span>
                    </label>

                    <button type="button" onclick="registrarDevolucion()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 active:scale-95 text-slate-950 font-black p-3 rounded-xl text-xs tracking-wider uppercase">
                        Registrar devolución
                    </button>
                </div>
            </div>

            <!-- Ventas del Día -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-slate-400 text-xs uppercase tracking-wider">🛒 Ventas Realizadas Hoy</h3>
                    <span id="contadorVentas" class="text-cyan-400 font-mono text-[10px]">0 Ventas</span>
                </div>
                <div id="listaVentas" class="space-y-2">
                    <!-- Dinámico -->
                </div>
            </div>
        </main>

        <footer class="bg-slate-950 p-3 text-center text-[10px] font-mono text-slate-500 border-t border-slate-800 mt-auto">
            SALES & PRINT CORE // RAWBT 🖨️
        </footer>
    </div>

    <script>
        var tipoActual = 'celular';
        var CLASE_INPUT = "w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:border-cyan-500 focus:outline-none text-slate-100";
        var CLASE_LABEL = "block text-[11px] font-semibold text-slate-400 mb-1";

        function leerStorage(clave) {
            try {
                var item = localStorage.getItem(clave);
                return item ? JSON.parse(item) : [];
            } catch (e) {
                return [];
            }
        }

        function esc(t) {
            return String(t).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            try {
                cambiarTipoVenta('celular');
                mostrarVentasRealizadas();
            } catch (e) {
                console.log(e);
            }
        });

        // Quita acentos y caracteres que la impresora no soporta
        function sinAcentos(t) {
            return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                    .replace(/¡/g, "").replace(/¿/g, "")
                    .replace(/[^\x00-\xFF]/g, "");
        }

        // Imprime usando la app RawBT (Android)
        function imprimirTicket(venta) {
            try {
                var t = "\x1B\x40\x1B\x61\x01\x1B\x45\x01";
                t += "=== CELLSTORE ===\nComprobante de Venta\n" +
                     new Date().toLocaleDateString() + " - " + venta.hora +
                     "\n------------------------------\n";
                t += "\x1B\x61\x00\x1B\x45\x00";
                t += "Cliente: " + venta.cliente + "\nItem: " + venta.descripcion + "\n";
                if (venta.imei && venta.imei !== 'N/A') {
                    t += "IMEI: " + venta.imei + "\n";
                }
                t += "Total Cobrado: Bs " + venta.montoVenta.toFixed(2) +
                     "\n------------------------------\n";
                t += "\x1B\x61\x01\n\n\n_______________ _______________\n" +
                     "Firma Vendedor  Firma Comprador\n\nGracias por su preferencia!\n\n\n";

                var b64 = btoa(sinAcentos(t));
                window.location.href = "intent:base64," + b64 +
                    "#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;";
            } catch (error) {
                alert("Error al preparar el ticket: " + error.message);
            }
        }

        function reimprimirVenta(index) {
            var ventas = leerStorage('ventas_realizadas');
            if (ventas[index]) {
                imprimirTicket(ventas[index]);
            }
        }

        function mensajeSinStock(texto) {
            return '<div class="p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl text-center"><p class="text-xs text-rose-400">' + texto + '</p></div>';
        }

        function etiquetaCelular(c) {
            return (c.modelo || 'Celular') + ' - IMEI: ' + (c.imei || 'N/A') + ' (Bs ' + (c.precioVenta || 0) + ')';
        }

        // Busca el celular escrito: coincidencia exacta o, si solo hay una parcial (ej. el IMEI), esa
        function buscarIndiceCelular(lista, texto) {
            texto = (texto || '').trim().toLowerCase();
            if (!texto) return -1;
            var hallados = [];
            for (var i = 0; i < lista.length; i++) {
                var e = etiquetaCelular(lista[i]).toLowerCase();
                if (e === texto) return i;
                if (e.indexOf(texto) !== -1) hallados.push(i);
            }
            return hallados.length === 1 ? hallados[0] : -1;
        }

        function etiquetaAccesorio(a) {
            return (a.nombre || 'Accesorio') + ' (Stock: ' + (a.stock || 0) + ') - Bs ' + (a.precio || 0);
        }

        // Índice del elemento cuyo texto coincide exacto o, si solo hay una parcial, esa
        function buscarIndiceTexto(lista, texto, etiqueta) {
            texto = (texto || '').trim().toLowerCase();
            if (!texto) return -1;
            var hallados = [];
            for (var i = 0; i < lista.length; i++) {
                var e = etiqueta(lista[i]).toLowerCase();
                if (e === texto) return i;
                if (e.indexOf(texto) !== -1) hallados.push(i);
            }
            return hallados.length === 1 ? hallados[0] : -1;
        }

        function cambiarTipoVenta(tipo) {
            tipoActual = tipo;

            var tabs = { celular: 'btnTabCel', accesorio: 'btnTabAcc', hidrogel: 'btnTabHid', skin: 'btnTabSkin' };
            for (var k in tabs) {
                document.getElementById(tabs[k]).className = "flex-1 py-2 text-[11px] font-bold rounded-xl transition " +
                    (k === tipo ? "bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/30" : "bg-slate-800 text-slate-300");
            }

            var contenedor = document.getElementById('seccionCampos');
            contenedor.innerHTML = '';

            if (tipo === 'celular') {
                var celulares = leerStorage('celulares_inventario');
                if (celulares.length === 0) {
                    contenedor.innerHTML = mensajeSinStock('No hay celulares en stock.');
                    return;
                }
                var opcionesHTML = '';
                for (var i = 0; i < celulares.length; i++) {
                    opcionesHTML += '<option value="' + esc(etiquetaCelular(celulares[i])) + '"></option>';
                }
                contenedor.innerHTML = '<div><label class="' + CLASE_LABEL + '">Celular (escribe modelo o IMEI) - ' + celulares.length + ' en stock</label><input type="text" id="indexCelular" list="listaCelulares" autocomplete="off" placeholder="Ej: A54 o 3582..." class="' + CLASE_INPUT + '"><datalist id="listaCelulares">' + opcionesHTML + '</datalist></div>';

            } else if (tipo === 'accesorio') {
                var accesorios = leerStorage('accesorios_inventario');
                if (accesorios.length === 0) {
                    contenedor.innerHTML = mensajeSinStock('No hay accesorios en stock.');
                    return;
                }
                var opcionesHTML = '';
                for (var i = 0; i < accesorios.length; i++) {
                    opcionesHTML += '<option value="' + esc(etiquetaAccesorio(accesorios[i])) + '"></option>';
                }
                contenedor.innerHTML = '<div class="space-y-2"><div><label class="' + CLASE_LABEL + '">Accesorio (escribe para buscar) - ' + accesorios.length + ' productos</label><input type="text" id="indexAccesorio" list="listaAccesorios" autocomplete="off" placeholder="Ej: cable, cargador..." class="' + CLASE_INPUT + '"><datalist id="listaAccesorios">' + opcionesHTML + '</datalist></div><div><label class="' + CLASE_LABEL + '">Cantidad</label><input type="number" id="cantAccesorioVenta" value="1" min="1" class="' + CLASE_INPUT + '"></div></div>';

            } else if (tipo === 'hidrogel' || tipo === 'skin') {
                var inv = leerStorage('hidrogel_inventario');
                var opcionesHTML = '';
                var primerPrecio = 0;
                var hay = false;
                for (var i = 0; i < inv.length; i++) {
                    var p = inv[i];
                    if (p.categoria === tipo && p.stock > 0) {
                        if (!hay) { primerPrecio = p.precioVenta || 0; hay = true; }
                        opcionesHTML += '<option value="' + i + '">' + esc(p.nombre) + ' (Stock: ' + p.stock + ') - Bs ' + (p.precioVenta || 0) + '</option>';
                    }
                }
                if (!hay) {
                    var nombreCat = tipo === 'skin' ? 'skins' : 'hidrogeles';
                    contenedor.innerHTML = mensajeSinStock('No hay ' + nombreCat + ' en stock. Regístralos en el módulo Hidrogel & Skins.');
                    return;
                }
                var etiqueta = tipo === 'skin' ? 'Seleccionar Skin' : 'Seleccionar Hidrogel';
                contenedor.innerHTML =
                    '<div class="space-y-2">' +
                        '<div><label class="' + CLASE_LABEL + '">' + etiqueta + '</label>' +
                            '<select id="indexHidrogel" onchange="actualizarPrecioHidrogel()" class="' + CLASE_INPUT + '">' + opcionesHTML + '</select></div>' +
                        '<div class="grid grid-cols-2 gap-2">' +
                            '<div><label class="' + CLASE_LABEL + '">Cantidad</label>' +
                                '<input type="number" id="cantHidrogelVenta" value="1" min="1" step="1" class="' + CLASE_INPUT + '"></div>' +
                            '<div><label class="' + CLASE_LABEL + '">Precio c/u (Bs)</label>' +
                                '<input type="number" id="precioHidrogelVenta" value="' + primerPrecio + '" step="0.01" min="0" required class="' + CLASE_INPUT + ' font-bold text-cyan-400"></div>' +
                        '</div>' +
                    '</div>';
            }
        }

        // Al elegir otro producto, carga su precio de venta
        function actualizarPrecioHidrogel() {
            var sel = document.getElementById('indexHidrogel');
            if (!sel) return;
            var inv = leerStorage('hidrogel_inventario');
            var prod = inv[sel.value];
            if (prod) {
                document.getElementById('precioHidrogelVenta').value = prod.precioVenta || 0;
            }
        }

        document.getElementById('formVenta').addEventListener('submit', function(e) {
            e.preventDefault();
            var cliente = document.getElementById('nombreComprador').value.trim();
            if (!cliente) {
                alert("Ingresa el nombre del comprador.");
                return;
            }

            var ventas = leerStorage('ventas_realizadas');
            var hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            var nuevaVenta = null;

            if (tipoActual === 'celular') {
                var inputCel = document.getElementById('indexCelular');
                if (!inputCel) return;
                var celulares = leerStorage('celulares_inventario');
                if (celulares.length === 0) return;
                var idx = buscarIndiceCelular(celulares, inputCel.value);
                if (idx < 0) {
                    alert('Escribe el modelo o IMEI y elige un celular de las sugerencias.');
                    return;
                }

                var celVendido = celulares[idx];
                var ganancia = parseFloat(celVendido.precioVenta || 0) - parseFloat(celVendido.precioCompra || 0);

                nuevaVenta = {
                    categoria: 'celular',
                    item: { tipo: 'celular', datos: celVendido },
                    cliente: cliente,
                    descripcion: "Celular: " + (celVendido.modelo || ''),
                    imei: celVendido.imei || 'N/A',
                    montoVenta: parseFloat(celVendido.precioVenta || 0),
                    ganancia: ganancia,
                    hora: hora
                };

                celulares.splice(idx, 1);
                localStorage.setItem('celulares_inventario', JSON.stringify(celulares));

            } else if (tipoActual === 'accesorio') {
                var inputAcc = document.getElementById('indexAccesorio');
                if (!inputAcc) return;
                var cantVenta = parseInt(document.getElementById('cantAccesorioVenta').value) || 1;
                var accesorios = leerStorage('accesorios_inventario');
                if (accesorios.length === 0) return;
                var idx = buscarIndiceTexto(accesorios, inputAcc.value, etiquetaAccesorio);
                if (idx < 0) {
                    alert('Escribe el accesorio y elige uno de las sugerencias.');
                    return;
                }

                var acc = accesorios[idx];
                if (acc.stock < cantVenta) {
                    alert('Stock insuficiente.');
                    return;
                }

                var montoTotal = (acc.precio || 0) * cantVenta;
                // Si el accesorio guarda su costo (precioCompra), se descuenta de la ganancia
                var costoAcc = (parseFloat(acc.precioCompra) || 0) * cantVenta;

                nuevaVenta = {
                    categoria: 'accesorio',
                    item: { tipo: 'accesorio', nombre: acc.nombre, cant: cantVenta },
                    cliente: cliente,
                    descripcion: "Accesorio: " + (acc.nombre || '') + " (x" + cantVenta + ")",
                    imei: null,
                    montoVenta: montoTotal,
                    ganancia: montoTotal - costoAcc,
                    hora: hora
                };

                acc.stock -= cantVenta;
                localStorage.setItem('accesorios_inventario', JSON.stringify(accesorios));

            } else if (tipoActual === 'hidrogel' || tipoActual === 'skin') {
                var selectH = document.getElementById('indexHidrogel');
                if (!selectH) return;
                var inv = leerStorage('hidrogel_inventario');
                var prod = inv[selectH.value];

                if (!prod || prod.categoria !== tipoActual) {
                    alert('Producto no válido.');
                    return;
                }

                var cant = parseInt(document.getElementById('cantHidrogelVenta').value, 10);
                if (isNaN(cant) || cant < 1) {
                    alert('Ingresa una cantidad válida.');
                    return;
                }
                if (prod.stock < cant) {
                    alert('Stock insuficiente. Solo quedan ' + prod.stock + ' piezas.');
                    return;
                }

                var precioUnit = parseFloat(document.getElementById('precioHidrogelVenta').value);
                if (isNaN(precioUnit) || precioUnit < 0) {
                    alert('Ingresa un precio válido.');
                    return;
                }

                var montoH = precioUnit * cant;
                var costoH = (parseFloat(prod.precioCompra) || 0) * cant;

                nuevaVenta = {
                    categoria: tipoActual,
                    item: { tipo: tipoActual, nombre: prod.nombre, cant: cant },
                    cliente: cliente,
                    descripcion: (tipoActual === 'skin' ? "Skin: " : "Hidrogel: ") + prod.nombre + " (x" + cant + ")",
                    imei: null,
                    montoVenta: montoH,
                    ganancia: montoH - costoH,
                    hora: hora
                };

                prod.stock -= cant;
                localStorage.setItem('hidrogel_inventario', JSON.stringify(inv));
            }

            if (!nuevaVenta) return;

            ventas.push(nuevaVenta);
            localStorage.setItem('ventas_realizadas', JSON.stringify(ventas));
            document.getElementById('nombreComprador').value = '';

            mostrarVentasRealizadas();
            cambiarTipoVenta(tipoActual);

            if (confirm('¡Venta registrada! ¿Imprimir ticket ahora?')) {
                imprimirTicket(nuevaVenta);
            }
        });

        function guardarLista(clave, lista) {
            localStorage.setItem(clave, JSON.stringify(lista));
        }

        // Anula una venta: devuelve el producto al stock y deja de contar en el corte
        function anularVenta(index) {
            var ventas = leerStorage('ventas_realizadas');
            var v = ventas[index];
            if (!v || v.anulada) return;

            var monto = 'Bs ' + (v.montoVenta ? v.montoVenta.toFixed(2) : '0.00');
            if (!confirm('¿Anular esta venta?\n\n' + (v.descripcion || '') + '\nCliente: ' + (v.cliente || '') + '\nMonto: ' + monto +
                '\n\nEl producto volverá al stock y la venta no contará en el corte de caja.')) {
                return;
            }

            var desc = v.descripcion || '';
            var cat = v.categoria;
            if (!cat) {
                var d = desc.toLowerCase();
                if (d.indexOf('celular') === 0 || (v.imei && v.imei !== 'N/A')) cat = 'celular';
                else if (d.indexOf('accesorio') === 0) cat = 'accesorio';
                else if (d.indexOf('skin') === 0) cat = 'skin';
                else if (d.indexOf('hidrogel') === 0) cat = 'hidrogel';
            }

            // Nombre y cantidad: del dato guardado en la venta, o deducidos del texto en ventas antiguas
            var nombre = (v.item && v.item.nombre) || desc.replace(/^(Accesorio|Hidrogel|Skin):\s*/i, '').replace(/\s*\(x\d+\)\s*$/, '');
            var cant = (v.item && v.item.cant) || 0;
            if (!cant) {
                var m = desc.match(/\(x(\d+)\)\s*$/);
                cant = m ? parseInt(m[1], 10) : 1;
            }
            var costoTotal = (parseFloat(v.montoVenta) || 0) - (parseFloat(v.ganancia) || 0);
            var avisoStock = '';

            if (cat === 'celular') {
                var celulares = leerStorage('celulares_inventario');
                var datos = (v.item && v.item.datos) || {
                    imei: v.imei,
                    modelo: desc.replace(/^Celular:\s*/i, ''),
                    precioCompra: costoTotal,
                    precioVenta: parseFloat(v.montoVenta) || 0
                };
                var yaExiste = celulares.some(function(c) { return c.imei && c.imei === datos.imei; });
                if (!yaExiste) {
                    celulares.push(datos);
                    guardarLista('celulares_inventario', celulares);
                }

            } else if (cat === 'accesorio') {
                var accesorios = leerStorage('accesorios_inventario');
                var encontrado = null;
                for (var i = 0; i < accesorios.length; i++) {
                    if ((accesorios[i].nombre || '').toLowerCase() === nombre.toLowerCase()) { encontrado = accesorios[i]; break; }
                }
                if (encontrado) {
                    encontrado.stock = (parseInt(encontrado.stock, 10) || 0) + cant;
                } else {
                    accesorios.push({
                        nombre: nombre,
                        stock: cant,
                        precio: (parseFloat(v.montoVenta) || 0) / cant,
                        precioCompra: costoTotal / cant
                    });
                    avisoStock = '\n(El accesorio ya no estaba en el inventario; se volvió a crear.)';
                }
                guardarLista('accesorios_inventario', accesorios);

            } else if (cat === 'hidrogel' || cat === 'skin') {
                var inv = leerStorage('hidrogel_inventario');
                var prod = null;
                for (var j = 0; j < inv.length; j++) {
                    if (inv[j].categoria === cat && (inv[j].nombre || '').toLowerCase() === nombre.toLowerCase()) { prod = inv[j]; break; }
                }
                if (prod) {
                    prod.stock = (parseInt(prod.stock, 10) || 0) + cant;
                } else {
                    inv.push({
                        categoria: cat,
                        nombre: nombre,
                        stock: cant,
                        precioCompra: costoTotal / cant,
                        precioVenta: (parseFloat(v.montoVenta) || 0) / cant
                    });
                    avisoStock = '\n(El producto ya no estaba en el inventario; se volvió a crear.)';
                }
                guardarLista('hidrogel_inventario', inv);

            } else {
                avisoStock = '\n(Esta venta es antigua y no tiene producto de inventario, así que no se devolvió stock.)';
            }

            v.anulada = true;
            v.horaAnulacion = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            guardarLista('ventas_realizadas', ventas);

            mostrarVentasRealizadas();
            cambiarTipoVenta(tipoActual);
            alert('Venta anulada.' + avisoStock);
        }

        // ---------- Devoluciones (ventas de días anteriores) ----------
        var CLS_DEV = "w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:border-amber-500 focus:outline-none text-slate-100";

        function devAlternar() {
            var p = document.getElementById('panelDevolucion');
            var abrir = p.classList.contains('hidden');
            p.classList.toggle('hidden');
            document.getElementById('devFlecha').textContent = abrir ? '▲' : '▼';
            if (abrir) devCambiarCategoria();
        }

        function devCambiarCategoria() {
            var cat = document.getElementById('devCategoria').value;
            var cont = document.getElementById('devCampos');
            document.getElementById('devMonto').value = '';

            if (cat === 'celular') {
                devCelLista = devCelularesVendidos();
                var opcDev = '';
                devCelLista.forEach(function(d) { opcDev += '<option value="' + esc(etiquetaCelular(d)) + '"></option>'; });
                cont.innerHTML =
                    '<div class="space-y-2">' +
                        '<div><label class="' + CLASE_LABEL + '">Buscar celular vendido (modelo o IMEI)</label>' +
                            '<input type="text" id="devBuscar" list="listaDevCel" autocomplete="off" oninput="devAutocompletarCelular()" placeholder="Escribe y elige para autocompletar..." class="' + CLS_DEV + '">' +
                            '<datalist id="listaDevCel">' + opcDev + '</datalist></div>' +
                        '<div><label class="' + CLASE_LABEL + '">IMEI o Número de Serie</label>' +
                            '<input type="text" id="devImei" placeholder="Ej: 358249012345678" class="' + CLS_DEV + ' font-mono"></div>' +
                        '<div><label class="' + CLASE_LABEL + '">Modelo y Condición</label>' +
                            '<input type="text" id="devModelo" placeholder="Ej: A54 (Usado 8.5/10)" class="' + CLS_DEV + '"></div>' +
                        '<div><label class="' + CLASE_LABEL + '">Precio de compra original (Bs)</label>' +
                            '<input type="number" id="devCosto" step="0.01" min="0" placeholder="Lo que te costó" class="' + CLS_DEV + '"></div>' +
                    '</div>';
                return;
            }

            var inv, opciones = '', hay = false;
            if (cat === 'accesorio') {
                inv = leerStorage('accesorios_inventario');
                for (var i = 0; i < inv.length; i++) {
                    hay = true;
                    opciones += '<option value="' + esc(inv[i].nombre || 'Accesorio') + '"></option>';
                }
            } else {
                inv = leerStorage('hidrogel_inventario');
                for (var j = 0; j < inv.length; j++) {
                    if (inv[j].categoria === cat) {
                        hay = true;
                        opciones += '<option value="' + j + '">' + esc(inv[j].nombre) + '</option>';
                    }
                }
            }

            if (!hay) {
                var nombreMod = cat === 'accesorio' ? 'Accesorios' : 'Hidrogel & Skins';
                cont.innerHTML = mensajeSinStock('No hay productos de esta categoría en el inventario. Regístralo primero en el módulo ' + nombreMod + '.');
                return;
            }

            cont.innerHTML =
                '<div class="space-y-2">' +
                    '<div><label class="' + CLASE_LABEL + '">Producto devuelto</label>' +
                        (cat === 'accesorio'
                            ? '<input type="text" id="devProducto" list="listaDevAcc" autocomplete="off" oninput="devActualizarMonto()" placeholder="Escribe el accesorio..." class="' + CLS_DEV + '"><datalist id="listaDevAcc">' + opciones + '</datalist>'
                            : '<select id="devProducto" onchange="devActualizarMonto()" class="' + CLS_DEV + '">' + opciones + '</select>') + '</div>' +
                    '<div><label class="' + CLASE_LABEL + '">Cantidad</label>' +
                        '<input type="number" id="devCant" value="1" min="1" step="1" oninput="devActualizarMonto()" class="' + CLS_DEV + '"></div>' +
                '</div>';
            devActualizarMonto();
        }

        // Producto elegido: accesorio = texto escrito; hidrogel/skin = combo box
        function devProductoSeleccionado(cat, sel, inv) {
            if (cat === 'accesorio') {
                var i = buscarIndiceTexto(inv, sel.value, function(a) { return a.nombre || 'Accesorio'; });
                return i < 0 ? null : inv[i];
            }
            return inv[sel.value];
        }

        // Sugiere el monto a devolver según el precio de venta del inventario (se puede cambiar)
        function devActualizarMonto() {
            var cat = document.getElementById('devCategoria').value;
            var sel = document.getElementById('devProducto');
            var cantEl = document.getElementById('devCant');
            if (!sel || !cantEl) return;
            var cant = parseInt(cantEl.value, 10) || 1;
            var inv = leerStorage(cat === 'accesorio' ? 'accesorios_inventario' : 'hidrogel_inventario');
            var prod = devProductoSeleccionado(cat, sel, inv);
            if (!prod) return;
            var precio = parseFloat(cat === 'accesorio' ? prod.precio : prod.precioVenta) || 0;
            document.getElementById('devMonto').value = (precio * cant).toFixed(2);
        }

        var devCelLista = [];

        // Celulares vendidos (hoy y en cierres) que ya no están en el inventario
        function devCelularesVendidos() {
            var todas = leerStorage('ventas_realizadas');
            leerStorage('historial_cierres').forEach(function(h) {
                if (Array.isArray(h.ventas)) todas = todas.concat(h.ventas);
            });
            var enStock = {};
            leerStorage('celulares_inventario').forEach(function(c) { if (c.imei) enStock[c.imei] = true; });
            var porImei = {};
            todas.forEach(function(v) {
                if (v.esDevolucion || v.anulada) return;
                var esCel = v.categoria === 'celular' || (!v.categoria && v.imei && v.imei !== 'N/A');
                if (!esCel) return;
                var monto = parseFloat(v.montoVenta) || 0;
                var d = (v.item && v.item.datos) || {
                    imei: v.imei,
                    modelo: (v.descripcion || '').replace(/^Celular:\s*/i, ''),
                    precioCompra: monto - (parseFloat(v.ganancia) || 0),
                    precioVenta: monto
                };
                if (!d.imei || d.imei === 'N/A' || enStock[d.imei]) return;
                porImei[d.imei] = d;
            });
            return Object.keys(porImei).map(function(k) { return porImei[k]; });
        }

        // Al elegir una sugerencia, rellena IMEI, modelo, costo y monto
        function devAutocompletarCelular() {
            var t = document.getElementById('devBuscar').value.trim().toLowerCase();
            if (!t) return;
            var d = null;
            devCelLista.forEach(function(x) {
                if (etiquetaCelular(x).toLowerCase() === t || String(x.imei).toLowerCase() === t) d = x;
            });
            if (!d) return;
            document.getElementById('devImei').value = d.imei || '';
            document.getElementById('devModelo').value = d.modelo || '';
            document.getElementById('devCosto').value = d.precioCompra != null ? d.precioCompra : '';
            document.getElementById('devMonto').value = d.precioVenta != null ? d.precioVenta : '';
        }

        function registrarDevolucion() {
            var cat = document.getElementById('devCategoria').value;
            var monto = parseFloat(document.getElementById('devMonto').value);
            if (isNaN(monto) || monto < 0) {
                alert('Ingresa el monto que se devuelve al cliente.');
                return;
            }
            var cliente = document.getElementById('devCliente').value.trim() || 'Sin nombre';
            var restock = document.getElementById('devRestock').checked;
            var hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            var costo = 0, descripcion = '', imei = null;
            var item = { tipo: cat, repuesto: restock };
            var celulares = null, inv = null, prod = null, cant = 1;

            if (cat === 'celular') {
                var imeiV = document.getElementById('devImei').value.trim();
                var modelo = document.getElementById('devModelo').value.trim();
                var costoCel = parseFloat(document.getElementById('devCosto').value);
                if (!imeiV || !modelo || isNaN(costoCel) || costoCel < 0) {
                    alert('Completa el IMEI, el modelo y el precio de compra.');
                    return;
                }
                celulares = leerStorage('celulares_inventario');
                if (restock && celulares.some(function(c) { return c.imei === imeiV; })) {
                    alert('Ese IMEI ya está en el inventario.');
                    return;
                }
                costo = costoCel;
                imei = imeiV;
                descripcion = 'Devolución Celular: ' + modelo;
                item.datos = { imei: imeiV, modelo: modelo, precioCompra: costoCel, precioVenta: monto };
            } else {
                var sel = document.getElementById('devProducto');
                if (!sel) {
                    alert('No hay un producto seleccionado.');
                    return;
                }
                cant = parseInt(document.getElementById('devCant').value, 10);
                if (isNaN(cant) || cant < 1) {
                    alert('Ingresa una cantidad válida.');
                    return;
                }
                inv = leerStorage(cat === 'accesorio' ? 'accesorios_inventario' : 'hidrogel_inventario');
                prod = devProductoSeleccionado(cat, sel, inv);
                if (!prod) {
                    alert('Producto no válido. Escribe el nombre y elige una sugerencia.');
                    return;
                }
                costo = (parseFloat(prod.precioCompra) || 0) * cant;
                var etiquetaCat = cat === 'accesorio' ? 'Accesorio' : (cat === 'skin' ? 'Skin' : 'Hidrogel');
                descripcion = 'Devolución ' + etiquetaCat + ': ' + prod.nombre + ' (x' + cant + ')';
                item.nombre = prod.nombre;
                item.cant = cant;
            }

            if (!confirm('¿Registrar esta devolución?\n\n' + descripcion + '\nSe devuelven: Bs ' + monto.toFixed(2) +
                (restock ? '\nEl producto vuelve al stock.' : '\nEl producto NO vuelve al stock (el costo cuenta como pérdida).'))) {
                return;
            }

            if (restock) {
                if (cat === 'celular') {
                    celulares.push(item.datos);
                    guardarLista('celulares_inventario', celulares);
                } else {
                    prod.stock = (parseInt(prod.stock, 10) || 0) + cant;
                    guardarLista(cat === 'accesorio' ? 'accesorios_inventario' : 'hidrogel_inventario', inv);
                }
            }

            // Se resta el ingreso. Si el producto vuelve al stock, la ganancia se revierte
            // solo por (monto - costo); si no vuelve, se pierde todo el monto devuelto.
            var ganancia = restock ? -(monto - costo) : -monto;

            var ventas = leerStorage('ventas_realizadas');
            ventas.push({
                categoria: cat,
                esDevolucion: true,
                cliente: cliente,
                descripcion: descripcion,
                imei: imei,
                montoVenta: -monto,
                ganancia: ganancia,
                hora: hora,
                item: item
            });
            guardarLista('ventas_realizadas', ventas);

            document.getElementById('devCliente').value = '';
            document.getElementById('devMonto').value = '';
            devAlternar();
            mostrarVentasRealizadas();
            cambiarTipoVenta(tipoActual);
            alert('Devolución registrada.');
        }

        // Deshace una devolución registrada por error
        function deshacerDevolucion(index) {
            var ventas = leerStorage('ventas_realizadas');
            var v = ventas[index];
            if (!v || !v.esDevolucion) return;
            if (!confirm('¿Deshacer esta devolución?\n\n' + (v.descripcion || '') +
                '\n\nSe quitará de la lista' + ((v.item && v.item.repuesto) ? ' y el producto saldrá del stock otra vez.' : '.'))) {
                return;
            }

            if (v.item && v.item.repuesto) {
                if (v.categoria === 'celular') {
                    var celulares = leerStorage('celulares_inventario');
                    var imeiDev = v.item.datos && v.item.datos.imei;
                    celulares = celulares.filter(function(c) { return c.imei !== imeiDev; });
                    guardarLista('celulares_inventario', celulares);
                } else {
                    var clave = v.categoria === 'accesorio' ? 'accesorios_inventario' : 'hidrogel_inventario';
                    var inv = leerStorage(clave);
                    for (var i = 0; i < inv.length; i++) {
                        var coincideCat = v.categoria === 'accesorio' || inv[i].categoria === v.categoria;
                        if (coincideCat && (inv[i].nombre || '').toLowerCase() === (v.item.nombre || '').toLowerCase()) {
                            inv[i].stock = Math.max(0, (parseInt(inv[i].stock, 10) || 0) - (v.item.cant || 1));
                            break;
                        }
                    }
                    guardarLista(clave, inv);
                }
            }

            ventas.splice(index, 1);
            guardarLista('ventas_realizadas', ventas);
            mostrarVentasRealizadas();
            cambiarTipoVenta(tipoActual);
        }

        function mostrarVentasRealizadas() {
            var ventas = leerStorage('ventas_realizadas');
            var lista = document.getElementById('listaVentas');
            var contador = document.getElementById('contadorVentas');
            if (!lista || !contador) return;

            lista.innerHTML = '';
            var activas = ventas.filter(function(v) { return !v.anulada && !v.esDevolucion; }).length;
            var anuladas = ventas.filter(function(v) { return v.anulada; }).length;
            var devs = ventas.filter(function(v) { return v.esDevolucion; }).length;
            contador.textContent = activas + ' Ventas' +
                (devs > 0 ? ' · ' + devs + ' devolución' + (devs === 1 ? '' : 'es') : '') +
                (anuladas > 0 ? ' · ' + anuladas + ' anulada' + (anuladas === 1 ? '' : 's') : '');

            if (ventas.length === 0) {
                lista.innerHTML = '<div class="bg-slate-950/50 p-3 rounded-xl border border-slate-800 text-center"><p class="text-xs text-slate-500">No hay ventas registradas hoy.</p></div>';
                return;
            }

            var htmlVentas = '';
            for (var i = ventas.length - 1; i >= 0; i--) {
                var v = ventas[i];
                var monto = 'Bs ' + (v.montoVenta ? Math.abs(v.montoVenta).toFixed(2) : '0.00');

                if (v.esDevolucion) {
                    htmlVentas += '<div class="bg-amber-950/20 p-3 rounded-xl border border-amber-700/40 flex justify-between items-center text-xs">' +
                        '<div><p class="font-bold text-amber-300">' + esc(v.descripcion || '') + ' <span class="text-slate-400 font-normal">(' + esc(v.cliente || '') + ')</span></p>' +
                        '<p class="text-amber-400 font-mono mt-0.5">Devuelto: ' + monto + ((v.item && v.item.repuesto) ? ' | Vuelve al stock' : ' | Sin stock') + '</p></div>' +
                        '<div class="flex flex-col items-end gap-1.5">' +
                            '<span class="text-[10px] text-slate-500 font-mono">' + esc(v.hora || '') + '</span>' +
                            '<button type="button" onclick="deshacerDevolucion(' + i + ')" class="bg-slate-800 text-amber-400 px-2 py-1.5 rounded-lg border border-amber-500/30 text-[10px] font-bold active:scale-95">Deshacer</button>' +
                        '</div></div>';

                } else if (v.anulada) {
                    htmlVentas += '<div class="bg-slate-900/50 p-3 rounded-xl border border-rose-900/50 flex justify-between items-center text-xs opacity-70">' +
                        '<div><p class="font-bold text-slate-500 line-through">' + esc(v.descripcion || '') + ' <span class="font-normal">(' + esc(v.cliente || '') + ')</span></p>' +
                        '<p class="text-rose-400 font-mono mt-0.5">ANULADA · ' + monto + '</p></div>' +
                        '<span class="text-[10px] text-slate-600 font-mono">' + esc(v.hora || '') + '</span></div>';

                } else {
                    htmlVentas += '<div class="bg-slate-900/90 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">' +
                        '<div><p class="font-bold text-slate-200">' + esc(v.descripcion || '') + ' <span class="text-slate-400 font-normal">(' + esc(v.cliente || '') + ')</span></p>' +
                        '<p class="text-cyan-400 font-mono mt-0.5">Cobro: ' + monto + (v.imei ? ' | IMEI: ' + esc(v.imei) : '') + '</p></div>' +
                        '<div class="flex flex-col items-end gap-1.5">' +
                            '<span class="text-[10px] text-slate-500 font-mono">' + esc(v.hora || '') + '</span>' +
                            '<div class="flex gap-1.5">' +
                                '<button type="button" onclick="reimprimirVenta(' + i + ')" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 p-1.5 rounded-lg border border-cyan-500/30 text-[10px]">🖨️</button>' +
                                '<button type="button" onclick="anularVenta(' + i + ')" class="bg-rose-950/50 text-rose-400 px-2 py-1.5 rounded-lg border border-rose-800 text-[10px] font-bold active:scale-95">Anular</button>' +
                            '</div>' +
                        '</div></div>';
                }
            }
            lista.innerHTML = htmlVentas;
        }
    </script>
</body>
</html>
